<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c16" media="(prefers-color-scheme: dark)" />
    <title>TeamLedger — paper-ready team research management</title>
    <meta name="description" content="Plan, track, and fairly attribute research paper work. TeamLedger gives lab and project teams a reviewed record of who contributed what, so authorship decisions are evidence-based." />
    <meta property="og:title" content="TeamLedger" />
    <meta property="og:description" content="Plan, track, and fairly attribute research paper work." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script>
      // Apply persisted theme before paint to avoid FOUC.
      (function () {
        try {
          var pref = localStorage.getItem("tl.theme");
          if (!pref) {
            pref = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (pref === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
