name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teamledger
          POSTGRES_PASSWORD: teamledger
          POSTGRES_DB: teamledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://teamledger:teamledger@localhost:5432/teamledger
      SECRET_KEY: ci-secret-key-please-change
      STORAGE_LOCAL_ROOT: /tmp/teamledger-files
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type (mypy strict)
        run: mypy app
      - name: Security (bandit)
        run: bandit -q -r app
      - name: Audit (pip-audit)
        run: pip-audit -r <(pip freeze)
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q --maxfail=1 --cov=app --cov-report=xml --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
