[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamledger-backend"
version = "1.0.0"
description = "TeamLedger backend (FastAPI)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "reportlab>=4.2",
    "ulid-py>=1.1",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "websockets>=13",
    "email-validator>=2.2",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
api = []
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "schemathesis>=3.21",
    "freezegun>=1.5",
    "respx>=0.21",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF006", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "RUF002", "RUF003"]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disable_error_code = ["misc", "no-any-return"]
warn_unused_ignores = true
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

# SQLAlchemy + Pydantic generates a lot of "Class cannot subclass" issues
# under strict mode because type stubs for SQLAlchemy 2 are still being
# filled in. ORM models and FastAPI handlers carry this. We override per
# module so the pure logic (scoring, storage helpers, services) stays strict.
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.api.*",
    "app.api.v1.*",
    "app.services.*",
    "app.realtime.*",
    "app.notifications.*",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "req_id(id): requirement id this test covers",
    "schemathesis: schemathesis-generated cases (slow)",
    "load: load checks (slow)",
    "e2e: playwright tests",
    "integration: requires DB",
]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
]
