# Render blueprint — API-only deploy. The frontend is hosted separately
# (Vercel recommended). This avoids building the React SPA inside the
# backend image and lets each tier scale independently.
#
# Build context = ./backend/ (render.yaml's rootDir). The Dockerfile
# (backend/Dockerfile.api) is built with the context pinned to
# ./backend/, so its COPY paths (`app/...`, `alembic/...`) resolve
# directly without needing repo-root prefixes.
#
# Apply: render blueprint launch (or `render deploys create` after
# connecting the repo). Set DATABASE_URL and SECRET_KEY in the dashboard.

services:
  - type: web
    name: teamledger-api
    plan: free
    runtime: docker
    # Build context = ./backend/. The Dockerfile copies `app/...` and
    # `alembic/...` from inside the context, so the build works without
    # needing repo-root paths.
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- required secrets (set in the Render dashboard, never commit) ----
      - key: DATABASE_URL
        sync: false  # paste the Neon connection string here
      - key: SECRET_KEY
        sync: false  # any 32+ random bytes
      - key: RESEND_API_KEY
        sync: false  # leave blank for console mailer during dev
      # ---- non-secret config ----
      - key: APP_ENV
        value: production
      - key: MAIL_BACKEND
        value: resend  # switch to "console" for free-tier without a key
      - key: RESEND_FROM
        value: TeamLedger <noreply@teamledger.app>
      - key: PUBLIC_BASE_URL
        value: https://teamledger-api.onrender.com  # update to your domain
      - key: CORS_ALLOWED_ORIGINS
        value: https://teamledger.vercel.app  # update to your Vercel URL
      - key: COOKIE_SAMESITE
        value: none  # required for cross-origin cookies (Vercel -> Render)
      - key: DEFAULT_TIMEZONE
        value: UTC
