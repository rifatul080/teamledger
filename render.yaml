# Render blueprint — API-only deploy. The frontend is hosted separately
# (Vercel recommended).
#
# IMPORTANT: Render's Docker service uses the REPO ROOT as the build
# context regardless of where the Dockerfile lives. The root-level
# `Dockerfile` has repo-root-relative COPY paths (e.g. `backend/app/...`),
# so it works. We DO NOT use backend/Dockerfile.api here because its
# paths (`app/...`, `alembic/...`) assume the context is ./backend/, which
# Render never sets for Docker services.
#
# The root Dockerfile also builds the SPA stage. For the split deploy
# (Vercel hosts the SPA), this build step is wasted work but doesn't
# break anything — the built SPA inside the image is never served
# because the frontend lives on Vercel.
#
# Apply: render blueprint launch (or `render deploys create` after
# connecting the repo). Set DATABASE_URL and SECRET_KEY in the dashboard.

services:
  - type: web
    name: teamledger-api
    plan: free
    runtime: docker
    # Render's Docker build context is the repo root, so the Dockerfile
    # lives at the root too. dockerContext is set explicitly to "." so
    # there's no ambiguity (Render defaults to the repo root anyway).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- required secrets (set in the Render dashboard, never commit) ----
      - key: DATABASE_URL
        sync: false  # paste the Neon connection string here
      - key: SECRET_KEY
        sync: false  # any 32+ random bytes
      - key: RESEND_API_KEY
        sync: false  # leave blank for console mailer during dev
      # ---- non-secret config ----
      - key: APP_ENV
        value: production
      - key: MAIL_BACKEND
        value: resend  # switch to "console" for free-tier without a key
      - key: RESEND_FROM
        value: TeamLedger <noreply@teamledger.app>
      - key: PUBLIC_BASE_URL
        value: https://teamledger-api.onrender.com  # update to your domain
      - key: CORS_ALLOWED_ORIGINS
        value: https://teamledger.vercel.app  # update to your Vercel URL
      - key: COOKIE_SAMESITE
        value: none  # required for cross-origin cookies (Vercel -> Render)
      - key: DEFAULT_TIMEZONE
        value: UTC
